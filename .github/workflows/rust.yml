name: Rust

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  AWS_REGION: ap-northeast-1
  AWS_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/onsen-tabi-github-actions-runner

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: onsen_tabi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.76.0
          override: true

      - name: Install Diesel CLI
        run: cargo install diesel_cli --version 2.1.1 --no-default-features --features mysql --locked || true

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppassword &> /dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        env:
          DATABASE_URL: mysql://root:password@127.0.0.1:3306/onsen_tabi_test
        run: |
          diesel migration run || echo "Migrations may have already been run"

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        env:
          DATABASE_URL: mysql://root:password@127.0.0.1:3306/onsen_tabi_test
          TEST_DATABASE_URL: mysql://root:password@127.0.0.1:3306/onsen_tabi_test
          JWT_SECRET_KEY: test-secret-key-for-ci
          RUST_LOG: debug
        run: cargo test --verbose

      - name: Run coverage with all tests
        env:
          DATABASE_URL: mysql://root:password@127.0.0.1:3306/onsen_tabi_test
          TEST_DATABASE_URL: mysql://root:password@127.0.0.1:3306/onsen_tabi_test
          JWT_SECRET_KEY: test-secret-key-for-ci
          RUST_LOG: info
        run: |
          cargo install cargo-llvm-cov --version 0.6.15
          rustup component add llvm-tools-preview
          
          # Run coverage including integration tests (--ignored)
          # Note: --test-threads=1 to avoid database race conditions
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info -- --test-threads=1 --include-ignored

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: konabe/onsen_tabi
          files: lcov.info
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: konabe/onsen_tabi:latest
      - name: Configure AWS credentials from IAM Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Start
        run: aws autoscaling start-instance-refresh --auto-scaling-group-name onsen-tabi-web-auto-scaling
